<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
	<meta charset="utf-8">
	<title>Таблица полученных заявок</title>
	<link rel="stylesheet" type="text/css">

	<style type="text/css">
html {
  font-family: sans-serif;
  line-height: 1.15;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
  font-size: 1rem;
  font-weight: 400;
  line-height: 1.5;
  color: #212529;
  text-align: left;
  background-color: #fff;
}


textarea {
  overflow: auto;
  resize: vertical;
}

.container {
  padding-top: 20px;
  padding-bottom: 100%;
  background-color: rgba(115, 151, 189, 0.7);

}

h1 {
  margin-top: 0;
  margin-bottom: 1rem;
  font-size: 1.5rem;
  font-weight: 500;
  line-height: 1.2;
  text-align: center;
}

table {
	border-spacing: 0 10px;
	font-family: 'Open Sans', sans-serif;
	font-weight: bold;
	margin: auto;
}

th {
	padding: 10px 20px;
	background: #c90c28;
	color: #000;
	border-right: 2px solid;
	font-size: 0.9em;

}

th:first-child {
	text-align: left;
}

th:last-child {
	border-right: none;
}

td {
	vertical-align: middle;
	padding: 10px;
	font-size: 14px;
	text-align: center;
	border-top: 2px solid #56433D;
	border-bottom: 2px solid #56433D;
	border-right: 2px solid #56433D;
}

td:first-child {
	border-left: 2px solid #56433D;
}

	td:nth-child(2){
	text-align: centre;
}

* {
.header {
	display: flex;
	justify-content: space-around;
	align-items: center;
	padding-bottom: 20px;
	padding-top: 20px;

	background-color: rgba(217, 178, 152, 0.7);
}
.logo img {
	width: 150px;
}
.name {
	font-size: 25pt;
	text-align: center;

	</style>
</head>

<body>
<div class="header">
	<div class="logo"><img src="/images/logo.png"></div>
	<div class="name"><a href="form.html" th:href="@{/form}">Электронная система подачи заявок на оказание ремонтных услуг <br> в СОЛ "Ждановец" </a></div>

</div>
<div class="container">
	<h1>Таблица полученных заявок</h1>
	<table id="myTable">
		<tr>
			<th>#</th>
			<th>Дата отправки</th>
			<th onclick="sortTable(0)"> Наименование работы</th>
			<th>Номер домика</th>
			<th>Сообщение</th>
			<th>Файлы</th>
			<th>Статус выполнения</th>
			<th>Изменить статус</th>
		</tr>
		<tr th:each="applicationForm : ${table}">
			<td th:text="${applicationForm.id}"></td>
			<td th:text="${applicationForm.dateOfPost}"></td>
			<td th:text="${applicationForm.sortOfWork}"></td>
			<td th:text="${applicationForm.houseNumber}"></td>
			<td th:text="${applicationForm.message}"></td>
			<td></td>
			<td th:text="${applicationForm.status}"></td>
			<td>
				<form th:action="@{/form/{id}(id=${applicationForm.id})}" method="post">
				<input type="text" placeholder="..." minlength="2"
					   maxlength="30" required="required" name="status">
			</form>
			</td>
		</tr>
		<script>
function sortTable(n) {
  var table, rows, switching, i, x, y, shouldSwitch, dir, switchcount = 0;
  table = document.getElementById("myTable");
  switching = true;
  dir = "asc";
  while (switching) {
    switching = false;
    rows = table.getElementsByTagName("TR");
    for (i = 1; i < (rows.length - 1); i++) {
      shouldSwitch = false;
      x = rows[i].getElementsByTagName("TD")[n];
      y = rows[i + 1].getElementsByTagName("TD")[n];
      if (dir == "asc") {
        if (x.innerHTML.toLowerCase() > y.innerHTML.toLowerCase()) {
          shouldSwitch = true;
          break;
        }
      } else if (dir == "desc") {
        if (x.innerHTML.toLowerCase() < y.innerHTML.toLowerCase()) {
          shouldSwitch = true;
          break;
        }
      }
    }
    if (shouldSwitch) {
      rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
      switching = true;
      switchcount ++;
    } else {
      if (switchcount == 0 && dir == "asc") {
        dir = "desc";
        switching = true;
      }
    }
  }
}
</script>
	</table>

</div>
<script>
		let sortedRows = Array.from(table.rows)
  .slice(1)
  .sort((rowA, rowB) => rowA.cells[0].innerHTML > rowB.cells[0].innerHTML ? 1 : -1);

table.tBodies[0].append(...sortedRows);
	</script>
</body>
</html>
